<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For You</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>

    <script>

        emailjs.init({
            publicKey: "lI3eJDAxrPeaVCMAN"
        });

    </script>

</head>


<body>


    <!-- =========================
         BACKGROUND
    ========================= -->

    <div id="background"></div>

    <div id="overlay"></div>


    <!-- =========================
         MAIN SCENE
    ========================= -->

    <div class="scene">

        <div id="content">

            <img
                id="sceneImage"
                class="scene-image"
                src=""
                alt=""
            >

            <div id="text"></div>

            <div id="key"></div>


            <div id="choices">

                <button id="yesBtn">
                    YES
                </button>

                <button id="notYetBtn">
                    NOT YET
                </button>

            </div>


            <div
                id="formArea"
                class="hidden"
            ></div>

        </div>

    </div>


    <!-- =========================
         FULLSCREEN GATE
    ========================= -->

    <div id="fullscreenGate">

        <div id="fullscreenInstruction">

            Press [ E ]

        </div>


        <button
            class="enterFullscreen"
            id="enterFullscreen"
            disabled
        >

            ENTER FULLSCREEN

        </button>

    </div>


    <!-- =========================
         FLOWERS
    ========================= -->

    <div id="flowerContainer"></div>


    <!-- =========================
         THANK YOU
    ========================= -->

    <div id="thankYou">

        Thank you so much 💌 <br>

    </div>


    <!-- =========================
         BURGER BUTTON
    ========================= -->

    <button
        id="menuButton"
        class="menu-button"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- =========================
         MENU OVERLAY
    ========================= -->

    <div
        id="menuOverlay"
        class="menu-overlay"
    ></div>


    <!-- =========================
         SIDE MENU
    ========================= -->

    <nav
        id="sideMenu"
        class="side-menu"
    >


        <div class="menu-header">

            <span>
                little things
            </span>


            <button
                id="menuClose"
                class="menu-close"
            >

                ×

            </button>

        </div>


        <!-- =========================
             MENU LIST
        ========================= -->

        <div
            id="menuList"
            class="menu-links"
        >

            <button data-page="story">
                Our Story
            </button>


            <button data-page="little">
                Little Things
            </button>


            <button data-page="memories">
                Memories
            </button>


            <button data-page="words">
                A Few Words
            </button>


            <button data-page="replay">
                Replay
            </button>

        </div>


        <!-- =========================
             MENU CONTENT
        ========================= -->

        <div
            id="menuContent"
            class="menu-content hidden"
        >

            <button
                id="menuBack"
                class="menu-back"
            >

                ← back

            </button>


            <div id="menuPageContent"></div>

        </div>

    </nav>


    <script src="script.js"></script>

</body>

</html>
